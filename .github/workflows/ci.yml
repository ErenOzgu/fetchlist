name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # actionlint is downloaded as a tarball and checked against this sha256 before it is unpacked.
  ACTIONLINT_VERSION: "1.7.7"
  ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.8
      - run: ruff check .
      - run: ruff format --check .
      - run: shellcheck examples/generate.sh
      - name: actionlint
        run: |
          set -euo pipefail
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -fsSL -o actionlint.tgz "${base}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          ./actionlint

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . pytest==9.1.1
      - run: python -m pytest -q -p no:cacheprovider
      - name: The committed example outputs are what the tool prints today
        run: examples/generate.sh --check

  itself:
    name: fetchlist checks this repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Everything this repository downloads is pinned
        run: python -m fetchlist check . --format github --strict
      - name: And it says no on the sample, which is unpinned on purpose
        run: |
          set -uo pipefail
          status=0
          python -m fetchlist check examples/sample > sample-check.txt || status=$?
          cat sample-check.txt
          test "${status}" -eq 1
          grep -q "FAIL: 18 not pinned" sample-check.txt
      - name: A tree with nothing unpinned passes
        run: |
          set -euo pipefail
          mkdir pinned
          printf 'FROM alpine:3.20@sha256:%s\n' "$(printf 'a%.0s' {1..64})" > pinned/Dockerfile
          python -m fetchlist check pinned

  wheel:
    name: The installed command works
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build a wheel and install it into a clean environment, the way a user would
        run: |
          set -euo pipefail
          pip install build==1.6.1
          python -m build
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install dist/*.whl
          unzip -l dist/*.whl
          if unzip -l dist/*.whl | grep -q "tests/"; then echo "::error::the wheel contains tests"; exit 1; fi
      - name: The command runs from another directory
        working-directory: ${{ runner.temp }}
        env:
          SRC: ${{ github.workspace }}
        run: |
          set -uo pipefail
          tool="$RUNNER_TEMP/clean/bin/fetchlist"
          "$tool" --version
          "$tool" scan "$SRC/examples/sample" | tail -1
          status=0
          "$tool" check "$SRC/examples/sample" > /dev/null || status=$?
          test "${status}" -eq 1
          "$tool" mirror "$SRC/examples/sample" | grep -qx "pypi.org"
