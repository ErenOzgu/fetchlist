[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fetchlist"
version = "0.1.0"
description = "List what a build downloads from outside the repository (images, actions, URLs, packages), say what is not pinned, and list what an offline mirror or firewall allowlist has to hold."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Eren Özgü" }]
keywords = ["supply-chain", "pinning", "ci", "dockerfile", "github-actions", "gitlab-ci", "devops", "security"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
fetchlist = "fetchlist.cli:main"

[tool.setuptools.packages.find]
include = ["fetchlist*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"fetchlist/*" = ["E501"]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
